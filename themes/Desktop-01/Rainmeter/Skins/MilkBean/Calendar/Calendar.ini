; MilkBean Calendar - Simple month view
; Local only, no network

[Rainmeter]
Update=#UpdateCalendar#
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=MilkBean Calendar
Author=MilkBean Desktop Theme
Information=Lightweight calendar for MilkBean desktop theme
Version=1.0.0

[Variables]
@Include=#@#..\Shared\Variables.inc

[MeasureYear]
Measure=Time
Format=%Y

[MeasureMonth]
Measure=Time
Format=%m

[MeasureDay]
Measure=Time
Format=%d

[MeasureMonthName]
Measure=Time
Format=%B

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#CalendarWidth#,#CalendarHeight#,12 | Fill Color #ColorBackground# | StrokeWidth 0
X=0
Y=0

[MeterHeader]
Meter=String
MeasureName=MeasureMonthName
MeasureName2=MeasureYear
X=(#CalendarWidth#/2)
Y=12
W=#CalendarWidth#
H=28
FontFace=#FontFace#
FontSize=16
FontColor=#ColorText#
StringAlign=Center
AntiAlias=1
Text=%1 %2

[MeterWeekdays]
Meter=String
X=12
Y=48
W=(#CalendarWidth#-24)
H=20
FontFace=#FontFace#
FontSize=#FontSizeCalendar#
FontColor=#ColorMuted#
StringAlign=Left
AntiAlias=1
Text=Su  Mo  Tu  We  Th  Fr  Sa

[MeterTodayHint]
Meter=String
MeasureName=MeasureDay
X=(#CalendarWidth#/2)
Y=90
W=#CalendarWidth#
H=40
FontFace=#FontFace#
FontSize=28
FontColor=#ColorPrimary#
StringAlign=Center
AntiAlias=1
Text=%1

[MeterTodayLabel]
Meter=String
X=(#CalendarWidth#/2)
Y=135
W=#CalendarWidth#
H=20
FontFace=#FontFace#
FontSize=12
FontColor=#ColorMuted#
StringAlign=Center
AntiAlias=1
Text=Today
