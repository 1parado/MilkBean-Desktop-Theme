; MilkBean Clock - Lightweight, low distraction
; Uses system local time, no network

[Rainmeter]
Update=#UpdateClock#
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=MilkBean Clock
Author=MilkBean Desktop Theme
Information=Simple clock for MilkBean desktop theme
Version=1.0.0

[Variables]
@Include=#@#..\Shared\Variables.inc
ShowSeconds=0
TimeFormat=24

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#ClockWidth#,#ClockHeight#,12 | Fill Color #ColorBackground# | StrokeWidth 0
X=0
Y=0

[MeasureTime]
Measure=Time
Format=%H:%M

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=(#ClockWidth#/2)
Y=12
W=#ClockWidth#
H=50
FontFace=#FontFace#
FontSize=#FontSizeTime#
FontColor=#ColorText#
StringAlign=Center
AntiAlias=1
Text=%1

[MeasureDate]
Measure=Time
Format=%m/%d  %A

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=(#ClockWidth#/2)
Y=58
W=#ClockWidth#
H=24
FontFace=#FontFace#
FontSize=#FontSizeDate#
FontColor=#ColorMuted#
StringAlign=Center
AntiAlias=1
Text=%1
