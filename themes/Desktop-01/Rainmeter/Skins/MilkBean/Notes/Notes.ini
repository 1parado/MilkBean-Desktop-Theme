; MilkBean Notes - Placeholder
; Real editable notes are implemented as independent WPF window
; (see src/MilkBean.Notes) because Rainmeter text editing is limited.

[Rainmeter]
Update=-1
AccurateText=1

[Metadata]
Name=MilkBean Notes Hint
Author=MilkBean Desktop Theme
Information=Placeholder. Use the dedicated Notes app for real editing.
Version=1.0.0

[Variables]
@Include=#@#..\Shared\Variables.inc

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,260,80,12 | Fill Color #ColorBackground# | StrokeWidth 0

[MeterHint]
Meter=String
X=130
Y=28
W=240
H=40
FontFace=#FontFace#
FontSize=12
FontColor=#ColorMuted#
StringAlign=Center
AntiAlias=1
Text=便签请使用独立便签窗口
